const chime=()=>{if(mute||!AC)return;[880,1175].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.15,AC.currentTime+i*.18);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+i*.18+.5);o.connect(g).connect(AC.destination);o.start(AC.currentTime+i*.18);o.stop(AC.currentTime+i*.18+.6)})};
let mt;const music=()=>{clearInterval(mt);if(!AC)return;const n=[261.6,329.6,392,523.3,392,329.6,293.7,349.2];let k=0;mt=setInterval(()=>{if(mute||!play)return;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=n[k++%8];g.gain.setValueAtTime(.05,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.9);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+1)},500)};
const speak=i=>{try{speechSynthesis.cancel();if(mute)return;const u=new SpeechSynthesisUtterance(VO[i]);const v=speechSynthesis.getVoices();u.voice=v.find(x=>x.lang==='en-IN')||v.find(x=>/en-(GB|AU)/.test(x.lang))||null;u.lang='en-IN';u.rate=1;speechSynthesis.speak(u)}catch(e){}};
function render(){let i=S.findIndex(([a,b])=>t>=a&&t<b);if(i<0)i=7;const el=$$('.s')[i];
if(i!==cur){cur=i;$$('.s').forEach((e,k)=>e.classList.toggle('act',k===i));$$('.on,.sel').forEach(e=>e.classList.remove('on','sel'));if(play)speak(i)}
const L=t-S[i][0];
$$('[data-s]',el).forEach(e=>{const s=+e.dataset.s,en=e.dataset.e?+e.dataset.e:1e9,on=L>=s&&L<en;if(on&&!e.classList.contains('on')&&e.dataset.snd)chime();e.classList.toggle('on',on)});
$$('[data-sel]',el).forEach(e=>e.classList.toggle('sel',L>=+e.dataset.sel));
$('#pf').style.width=t/90*100+'%';const m=Math.floor(t);$('#tm').textContent=`0:${String(Math.min(m,90)).padStart(2,'0')} / 1:30`.replace('0:90','1:30')}
function tick(ts){if(play){t+=(ts-last)/1000;if(t>=90){t=89.99;play=false;$('#pp').textContent='Replay';try{speechSynthesis.cancel()}catch(e){}}}last=ts;render();requestAnimationFrame(tick)}
$('#go').onclick=()=>{$('#start').remove();AC=new (window.AudioContext||window.webkitAudioContext)();music();play=true;cur=-1;requestAnimationFrame(x=>{last=x;tick(x)})};
$('#pp').onclick=()=>{if(t>=89.9){t=0;cur=-1}play=!play;$('#pp').textContent=play?'Pause':'Play';try{play?speechSynthesis.resume():speechSynthesis.pause()}catch(e){}};
$('#rs').onclick=()=>{t=0;cur=-1;play=true;$('#pp').textContent='Pause'};
$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'Unmute':'Mute';if(mute)try{speechSynthesis.cancel()}catch(e){}else speak(cur)};
render();
</script></body></html>
